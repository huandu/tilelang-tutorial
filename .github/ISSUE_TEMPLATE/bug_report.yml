name: Bug report
description: 报告页面、构建或交互问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 发生了什么，预期是什么？
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 页面 URL
      placeholder: https://tilelang-tutorial.huandu.me/...
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器或环境
      placeholder: Safari 20 / macOS 16
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或日志
